[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-multi-agent-framework"
version = "0.1.0"
description = "A production-ready multi-agent orchestration framework using LangChain, LangGraph, and CrewAI patterns."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.2.0,<0.3.0",
    "langchain-chroma>=0.1.0,<0.2.0",
    "langgraph>=0.2.0,<0.3.0",
    "chromadb>=0.5.0,<0.6.0",
    "openai>=1.40.0,<2.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
search = [
    "tavily-python>=0.4.0,<1.0.0",
    "duckduckgo-search>=6.0.0,<7.0.0",
]
pinecone = [
    "langchain-pinecone>=0.1.0,<0.2.0",
]
weaviate = [
    "langchain-weaviate>=0.0.3,<0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
